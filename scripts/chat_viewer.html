<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Chat & Transcript Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --bg-card-hover: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-purple: #bc8cff;
      --accent-green: #3fb950;
      --accent-amber: #d29922;
      --border-color: #30363d;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; }
    .brand-badge { background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue)); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .controls { display: flex; align-items: center; gap: 14px; }
    .file-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .file-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); }
    .search-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      width: 260px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent-blue); }
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 60px 20px;
      text-align: center;
      background: var(--bg-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent-blue); background: var(--bg-card); }
    .drop-zone h3 { font-size: 20px; margin-bottom: 8px; }
    .drop-zone p { color: var(--text-secondary); font-size: 14px; }
    .message-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .message-card.user { border-left: 4px solid var(--accent-blue); }
    .message-card.model { border-left: 4px solid var(--accent-purple); }
    .message-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 8px;
    }
    .role-badge {
      font-weight: 600;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .role-badge.user { background: rgba(88, 166, 255, 0.15); color: var(--accent-blue); }
    .role-badge.model { background: rgba(188, 140, 255, 0.15); color: var(--accent-purple); }
    .message-body {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tool-calls {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent-amber);
      font-weight: 600;
      cursor: pointer;
    }
    .tool-content {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #c9d1d9;
      white-space: pre-wrap;
      display: none;
    }
    .tool-content.show { display: block; }
    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .stat-item strong { color: var(--text-primary); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Antigravity Chat & Log Viewer</span>
      <span class="brand-badge">JSONL Reader</span>
    </div>
    <div class="controls">
      <input type="text" id="searchBox" class="search-box" placeholder="Search transcript content..." oninput="filterMessages()" />
      <button class="file-btn" onclick="document.getElementById('fileInput').click()">📁 Open transcript.jsonl</button>
      <input type="file" id="fileInput" accept=".jsonl,.json,.txt" style="display:none" onchange="handleFileSelect(event)" />
    </div>
  </header>

  <main id="chatContainer">
    <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <h3>Drag & Drop <code>transcript.jsonl</code> here</h3>
      <p>or click to browse from <code>C:\Users\...\.gemini\antigravity-ide\brain\&lt;session-id&gt;\.system_generated\logs\</code></p>
    </div>
  </main>

  <script>
    let allMessages = [];

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) parseJSONL(e.dataTransfer.files[0]);
    });

    function handleFileSelect(event) {
      if (event.target.files.length) parseJSONL(event.target.files[0]);
    }

    function parseJSONL(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        const lines = text.split('\n');
        allMessages = [];

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const data = JSON.parse(trimmed);
            allMessages.push(data);
          } catch (err) {}
        }

        renderMessages(allMessages);
      };
      reader.readAsText(file);
    }

    function renderMessages(messages) {
      const container = document.getElementById('chatContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div class="stat-item">Total Steps: <strong>${messages.length}</strong></div>
          <div class="stat-item">Loaded File: <strong>transcript.jsonl</strong></div>
        </div>
      `;

      messages.forEach((msg, idx) => {
        const card = document.createElement('div');
        const role = (msg.type === 'USER_INPUT' || msg.source === 'USER_EXPLICIT') ? 'user' : 'model';
        card.className = `message-card ${role}`;

        let toolHtml = '';
        if (msg.tool_calls && msg.tool_calls.length) {
          toolHtml = msg.tool_calls.map((t, tIdx) => `
            <div class="tool-calls">
              <div class="tool-header" onclick="this.nextElementSibling.classList.toggle('show')">
                <span>⚡ Tool: ${t.name || 'Function Call'}</span>
                <span>▼</span>
              </div>
              <div class="tool-content">
                <strong>Arguments:</strong><br>${JSON.stringify(t.args || t.arguments || {}, null, 2)}
              </div>
            </div>
          `).join('');
        }

        card.innerHTML = `
          <div class="message-header">
            <span class="role-badge ${role}">${role.toUpperCase()} • Step #${msg.step_index ?? idx + 1}</span>
            <span>Type: ${msg.type || 'Message'}</span>
          </div>
          <div class="message-body">${escapeHtml(msg.content || '')}</div>
          ${toolHtml}
        `;

        container.appendChild(card);
      });
    }

    function filterMessages() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const filtered = allMessages.filter(m => (m.content || '').toLowerCase().includes(query));
      renderMessages(filtered);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
