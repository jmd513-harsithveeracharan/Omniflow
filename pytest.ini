[pytest]
testpaths = tests/unit tests/integration
pythonpath = .
norecursedirs = _reference_repos _deleted_archive _legacy_archive scripts .git .pytest_cache legacy scratch tests/e2e_live
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Fast in-memory unit tests
    integration: Local database and server integration tests
    live: Tests calling external cloud APIs (Gemini, Fabric REST)
